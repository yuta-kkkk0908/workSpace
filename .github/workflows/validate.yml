name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install jsonschema
      - name: Initialize DBs
        run: |
          python scripts/data/init_topics_db.py
          python scripts/data/init_needs_db.py
          python scripts/data/init_investment_db.py
          python scripts/data/init_ops_db.py
      - name: Validate topics
        run: python scripts/validate_topics.py --check-db-first
